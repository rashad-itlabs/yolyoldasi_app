# Static analysis configuration.
#
# Run `flutter analyze` (or let the IDE surface these inline). The rules below
# go beyond `flutter_lints` in the places that matter for this codebase:
# architecture boundaries, async safety and consistent widget style.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These are real bugs waiting to happen, not style preferences.
    invalid_annotation_target: ignore
    use_build_context_synchronously: error
    unawaited_futures: warning
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # ------------------------------------------------------------- correctness
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    no_adjacent_strings_in_list: true
    throw_in_finally: true
    unnecessary_statements: true
    prefer_void_to_null: true

    # ------------------------------------------------------------------- style
    always_put_required_named_parameters_first: false
    # Deliberately off: explicit `min: 1`, `tone: BannerTone.info` and the like
    # document intent even when they match the default.
    # avoid_redundant_argument_values: true
    directives_ordering: true
    omit_local_variable_types: true
    prefer_final_locals: false
    prefer_single_quotes: true
    require_trailing_commas: false
    sort_child_properties_last: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true

    # ------------------------------------------------------------------ Flutter
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    use_key_in_widget_constructors: true

    # --------------------------------------------------------------- documented
    # Public API in `core/` is the shared vocabulary of the app; it should say
    # what it is for. Feature code is exempt by convention, not by config.
    slash_for_doc_comments: true
